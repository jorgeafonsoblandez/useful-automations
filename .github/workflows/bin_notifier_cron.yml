name: Check bin day

on:
  schedule:
    # Scheduled for Monday morning: 06:15 NZST / 07:15 NZDT (10h earlier than previous afternoon schedule).
    # Sunday 18:15 UTC ≈ Monday 06:15 NZST / 07:15 NZDT.
    # Avoid exact top of hour to bypass GitHub Actions queue congestion.
    - cron: "15 18 * * 0"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  check-bins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./2_bin_notifier
        run: pip install -r requirements.txt

      - name: Run scraper
        working-directory: ./2_bin_notifier
        env:
          BIN_BOT_TOKEN: ${{ secrets.BIN_BOT_TOKEN }}
          BIN_CHAT_ID: ${{ secrets.BIN_CHAT_ID }}
          BIN_COLLECTION_URL: ${{ secrets.BIN_COLLECTION_URL }}
        run: python scraper.py

      # The scraper falls back to a Telegram message with a direct link
      # instead of raising, so this job succeeds even when the site blocks
      # the request — but the debug HTML is still uploaded if it was saved,
      # for troubleshooting.
      - name: Upload debug page if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-response
          path: 2_bin_notifier/debug_response.html
          if-no-files-found: ignore
