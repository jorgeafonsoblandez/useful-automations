name: Competitor Radar

on:
  schedule:
    # Runs at 08:00 UTC every day
    - cron: "0 8 * * *"
  workflow_dispatch: {} # Allows manual triggering from the Actions tab

jobs:
  check-competitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the snapshot back to the repo
    steps:
      - uses: actions/checkout@v4

      - name: Cache snapshots
        uses: actions/cache@v4
        with:
          path: 3_competitor_radar/snapshot_*.txt
          key: competitor-snapshots-${{ github.run_id }}
          restore-keys: |
            competitor-snapshots-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./3_competitor_radar
        run: pip install -r requirements.txt

      - name: Run Radar
        working-directory: ./3_competitor_radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.RADAR_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.RADAR_CHAT_ID }}
          TARGET_URLS: ${{ secrets.RADAR_TARGET_URLS }}
        run: python radar.py
